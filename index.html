<style>
  :root{
    --cream:#FFF8E7;
    --ink:#2B2640;
    --coral:#FF6B5B;
    --sky:#3EC6E0;
    --sun:#FFC94A;
    --grass:#5FD69C;
    --card:#FFFFFF;
    --shadow: 6px 6px 0 rgba(43,38,64,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(62,198,224,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,91,0.15), transparent 45%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100svh;
    padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }
  header{
    text-align:center;
    margin-bottom:16px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.9rem;
    margin:0;
    letter-spacing:0.5px;
    color:var(--ink);
  }
  h1 span{color:var(--coral);}
  .sub{
    font-weight:700;
    font-size:0.82rem;
    color:#6b6580;
    margin-top:4px;
  }

  .stage{
    background:var(--card);
    border-radius:22px;
    box-shadow: var(--shadow);
    border: 3px solid var(--ink);
    padding:22px 10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:106px;
    margin-bottom:18px;
    flex-wrap:nowrap;
    gap:8px;
  }

  .tileRow{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:nowrap;
    gap:8px;
    max-width:100%;
  }

  .pairHint{
    margin-top:10px;
    font-size:0.8rem;
    font-weight:700;
    color:#6b6580;
    text-align:center;
    line-height:1.25;
  }
  .pairHint b{ color:var(--ink); }

  .tile{
    width:46px; height:46px;
    flex-shrink:0;
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.4rem;
    text-transform:uppercase;
    box-shadow: 3px 3px 0 rgba(43,38,64,0.18);
    opacity:0;
    transform: translateY(14px) scale(0.85);
    animation: pop 0.38s ease forwards;
  }
  .tile.real{ background:var(--grass); }
  .tile.phonetic{ background:var(--sky); }
  @keyframes pop{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .placeholder{
    font-weight:700;
    color:#b8b2c9;
    font-size:0.92rem;
  }

  .controls{
    background:var(--card);
    border-radius:20px;
    border:3px solid var(--ink);
    padding:15px;
    box-shadow: var(--shadow);
    margin-bottom:16px;
  }
  .group{ margin-bottom:13px; }
  .group:last-child{ margin-bottom:0; }
  .label{
    font-weight:800;
    font-size:0.74rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#6b6580;
    margin-bottom:6px;
    display:block;
  }
  .seg{
    display:flex;
    gap:7px;
  }
  .seg button{
    flex:1;
    padding:10px 5px;
    border-radius:11px;
    border:2.5px solid var(--ink);
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:0.9rem;
    color:var(--ink);
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .seg button:active{ transform: scale(0.95); }
  .seg button.active{
    background:var(--coral);
    color:#fff;
  }
  .seg button.active.type-real{ background:var(--grass); }
  .seg button.active.type-phon{ background:var(--sky); }

  .diffDesc{
    margin-top:8px;
    font-size:0.76rem;
    font-weight:700;
    color:#6b6580;
    line-height:1.35;
    background:var(--cream);
    border:2px dashed #d8d2e8;
    border-radius:10px;
    padding:8px 10px;
  }
  .diffDesc b{ color:var(--ink); }

  .go{
    width:100%;
    padding:16px;
    border-radius:17px;
    border:3px solid var(--ink);
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.2rem;
    letter-spacing:0.4px;
    box-shadow: 4px 4px 0 rgba(43,38,64,0.25);
    cursor:pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    flex-shrink:0;
  }
  .go:active{
    transform: translate(3px,3px);
    box-shadow: 2px 2px 0 rgba(43,38,64,0.25);
  }

  .footerRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:14px;
    flex-shrink:0;
  }
  footer{
    text-align:center;
    font-size:0.74rem;
    color:#a39dbb;
    font-weight:700;
  }
  .flagToggle{
    width:42px; height:42px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--card);
    font-size:1rem;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
    box-shadow: 2px 2px 0 rgba(43,38,64,0.15);
    flex-shrink:0;
  }
  .flagToggle:active{ transform: scale(0.9); }

  @media (max-width:340px){
    .wrap{
      padding-left:calc(12px + env(safe-area-inset-left));
      padding-right:calc(12px + env(safe-area-inset-right));
    }
    .stage{ padding-left:8px; padding-right:8px; }
    .tileRow{ gap:6px; }
    .tile{
      width:43px;
      height:43px;
      font-size:1.3rem;
    }
  }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span>Blocks</span></h1>
    <div class="sub">tap. sound it out. play again.</div>
  </header>

  <div class="stage" id="stage" aria-live="polite">
    <div class="placeholder">tap the button below to make a word</div>
  </div>

  <div class="controls">
    <div class="group" id="lettersGroup">
      <span class="label">Letters</span>
      <div class="seg" id="lettersSeg">
        <button data-val="3" class="active">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Word type</span>
      <div class="seg" id="typeSeg">
        <button data-val="real" class="active type-real">Real words</button>
        <button data-val="pairs" class="type-phon">Letter Pairs</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Difficulty</span>
      <div class="seg" id="diffSeg">
        <button data-val="easy" class="active">Easy</button>
        <button data-val="medium">Medium</button>
        <button data-val="hard">Hard</button>
      </div>
      <div class="diffDesc" id="diffDesc"></div>
    </div>
  </div>

  <button class="go" id="goBtn">🎲 New word</button>
  <div class="footerRow">
    <footer>Works offline · add me to your home screen</footer>
    <button id="variantToggle" class="flagToggle" title="Switch English spelling"></button>
  </div>
</div>

// ---------------------------------------------------------------------
// 2) DEV-TIME WORD DATABASE VALIDATION
//    Runs once on load. Logs clearly to console; never blocks the app.
// ---------------------------------------------------------------------
(function validateWordDatabase(){
  const errors = [];
  const LENGTHS = [3,4,5];
  const DIFFS = ["easy","medium","hard"];

  function checkWord(w, L, d, source){
    if (typeof w !== "string") { errors.push(`${source}[${L}][${d}]: non-string entry`); return; }
    if (/\s/.test(w)) errors.push(`${source}[${L}][${d}]: "${w}" contains whitespace`);
    if (!/^[a-z]+$/.test(w)) errors.push(`${source}[${L}][${d}]: "${w}" contains punctuation or non-alphabetic characters`);
    if (w.length !== L) errors.push(`${source}[${L}][${d}]: "${w}" is ${w.length} letters, filed under length ${L}`);
  }

  const baseAll = new Map();
  for (const L of LENGTHS){
    if (!BASE_WORDS[L]) { errors.push(`BASE_WORDS missing length ${L}`); continue; }
    const seenAcrossTiers = new Map();
    for (const d of DIFFS){
      if (!BASE_WORDS[L][d]) { errors.push(`BASE_WORDS[${L}] missing "${d}" array`); continue; }
      const words = BASE_WORDS[L][d];
      if (words.length === 0) errors.push(`BASE_WORDS[${L}][${d}] is empty`);
      const seen = new Set();
      for (const w of words){
        checkWord(w, L, d, "BASE_WORDS");
        if (seen.has(w)) errors.push(`BASE_WORDS[${L}][${d}]: duplicate "${w}"`);
        if (seenAcrossTiers.has(w)) errors.push(`BASE_WORDS[${L}]: "${w}" appears in both ${seenAcrossTiers.get(w)} and ${d}`);
        seen.add(w);
        seenAcrossTiers.set(w, d);
        baseAll.set(`${L}:${w}`, d);
      }
    }
  }

  for (const variant of Object.keys(REGIONAL_WORDS)){
    for (const L of LENGTHS){
      if (!REGIONAL_WORDS[variant][L]) continue;
      const seenAcrossTiers = new Map();
      for (const d of DIFFS){
        const words = REGIONAL_WORDS[variant][L][d] || [];
        const seen = new Set();
        for (const w of words){
          checkWord(w, L, d, `REGIONAL_WORDS.${variant}`);
          if (seen.has(w)) errors.push(`REGIONAL_WORDS.${variant}[${L}][${d}]: duplicate "${w}"`);
          if (seenAcrossTiers.has(w)) errors.push(`REGIONAL_WORDS.${variant}[${L}]: "${w}" appears in both ${seenAcrossTiers.get(w)} and ${d}`);
          if (baseAll.has(`${L}:${w}`)) errors.push(`REGIONAL_WORDS.${variant}[${L}][${d}]: "${w}" already exists in BASE_WORDS`);
          seen.add(w);
          seenAcrossTiers.set(w, d);
        }
      }
    }
  }

  // Letter Pairs validation: every entry must be exactly 2 lowercase
  // letters, no duplicates within or across tiers.
  // (Runs separately below, after LETTER_PAIRS is declared -- see section 7.)

  if (errors.length){
    console.error(`Word Blocks: ${errors.length} word-database issue(s) found:`);
    errors.forEach(e => console.error(" -", e));
  } else {
    console.log("Word Blocks: word database validation passed.");
  }
})();

// ---------------------------------------------------------------------
// 3) WORD POOL HELPER (merges base + regional overlay for a variant)
// ---------------------------------------------------------------------
function getWordPool(length, difficulty, variant){
  const base = (BASE_WORDS[length] && BASE_WORDS[length][difficulty]) || [];
  const regional = (REGIONAL_WORDS[variant] && REGIONAL_WORDS[variant][length] && REGIONAL_WORDS[variant][length][difficulty]) || [];
  return base.concat(regional);
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------------------------------------------------------------------
// 4) CUMULATIVE DIFFICULTY WEIGHTING
//    Medium and Hard include earlier tiers for reinforcement, weighted
//    so genuinely harder words still show up often enough to matter.
// ---------------------------------------------------------------------
const DIFFICULTY_WEIGHTS = {
  easy:   [["easy", 1.0]],
  medium: [["easy", 0.30], ["medium", 0.70]],
  hard:   [["easy", 0.20], ["medium", 0.35], ["hard", 0.45]]
};

function pickWeightedTier(difficulty){
  const weights = DIFFICULTY_WEIGHTS[difficulty];
  const r = Math.random();
  let cumulative = 0;
  for (const [tier, weight] of weights){
    cumulative += weight;
    if (r <= cumulative) return tier;
  }
  return weights[weights.length - 1][0];
}

// ---------------------------------------------------------------------
// 5) RECENT-HISTORY (NO-REPEAT) TRACKING
//    Only the main displayed word counts -- not description examples.
//    Stored locally only; nothing is ever sent anywhere.
// ---------------------------------------------------------------------
const HISTORY_KEY = "wordblocks_recent_history";
const HISTORY_LIMIT = 25;

function loadHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveHistory(history){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch(e) { /* localStorage unavailable -- non-critical, fail silently */ }
}
function pushHistory(word){
  let history = loadHistory();
  history.push(word);
  if (history.length > HISTORY_LIMIT) history = history.slice(history.length - HISTORY_LIMIT);
  saveHistory(history);
}

// ---------------------------------------------------------------------
// 6) REAL-WORD GENERATION (cumulative tiers + regional overlay + no-repeat)
// ---------------------------------------------------------------------
function generateRealWord(length, difficulty, variant, excludeSet){
  for (let attempt = 0; attempt < 100; attempt++){
    const tier = pickWeightedTier(difficulty);
    const pool = getWordPool(length, tier, variant);
    if (pool.length === 0) continue;
    const candidate = pick(pool);
    if (!excludeSet.has(candidate)) return candidate;
  }
  // Fallback if the pool is exhausted by exclusion (rare) -- ignore history once.
  const tier = pickWeightedTier(difficulty);
  const pool = getWordPool(length, tier, variant);
  return pool.length ? pick(pool) : "";
}

(function validateLetterPairs(){
  const errors = [];
  const seen = new Set();
  for (const d of ["easy","medium","hard"]){
    if (!LETTER_PAIRS[d]) { errors.push(`LETTER_PAIRS missing "${d}" array`); continue; }
    const pairs = LETTER_PAIRS[d];
    if (pairs.length === 0) errors.push(`LETTER_PAIRS[${d}] is empty`);
    for (const item of pairs){
      if (!item || typeof item !== "object") { errors.push(`LETTER_PAIRS[${d}]: non-object entry`); continue; }
      if (!/^[a-z]{2}$/.test(item.pair || "")) errors.push(`LETTER_PAIRS[${d}]: "${item.pair}" is not exactly 2 lowercase letters`);
      if (!/^[a-z]+$/.test(item.example || "")) errors.push(`LETTER_PAIRS[${d}]: "${item.pair}" has an invalid example "${item.example}"`);
      if (item.example && !item.example.includes(item.pair)) errors.push(`LETTER_PAIRS[${d}]: example "${item.example}" does not contain pair "${item.pair}"`);
      if (seen.has(item.pair)) errors.push(`LETTER_PAIRS: duplicate "${item.pair}" across tiers`);
      seen.add(item.pair);
    }
  }
  if (errors.length){
    console.error(`Word Blocks: ${errors.length} letter-pair issue(s) found:`);
    errors.forEach(e => console.error(" -", e));
  } else {
    console.log("Word Blocks: letter-pairs validation passed.");
  }
})();

function generateLetterPair(difficulty, excludeSet){
  for (let attempt = 0; attempt < 100; attempt++){
    const tier = pickWeightedTier(difficulty);
    const pool = LETTER_PAIRS[tier];
    const candidate = pick(pool);
    if (!excludeSet.has(`pair:${candidate.pair}`)) return candidate;
  }
  const tier = pickWeightedTier(difficulty);
  return pick(LETTER_PAIRS[tier]);
}

// ---------------------------------------------------------------------
// 8) UNIFIED ENTRY POINTS
// ---------------------------------------------------------------------
function generateEntry(length, type, difficulty, variant, excludeSet){
  excludeSet = excludeSet || new Set();
  if (type === "real"){
    const word = generateRealWord(length, difficulty, variant, excludeSet);
    return { text: word, example: "", historyKey: word };
  }
  const item = generateLetterPair(difficulty, excludeSet);
  return { text: item.pair, example: item.example, historyKey: `pair:${item.pair}` };
}

// Pure-tier examples for the description box: always shows the specific
// patterns of the SELECTED tier (not the cumulative blend used in actual
// play), so "Hard" always demonstrates hard patterns, not random Easy words.
function generatePureTierExamples(length, type, difficulty, variant, n){
  const examples = new Set();
  let attempts = 0;
  while (examples.size < n && attempts < 50){
    let candidate;
    if (type === "real"){
      const pool = getWordPool(length, difficulty, variant);
      if (pool.length === 0) break;
      candidate = pick(pool);
    } else {
      const item = pick(LETTER_PAIRS[difficulty]);
      candidate = `${item.pair} → ${item.example}`;
    }
    examples.add(candidate);
    attempts++;
  }
  return [...examples];
}

// ---------------------------------------------------------------------
// 9) VARIANT (UK/AU vs US) PERSISTENCE
// ---------------------------------------------------------------------
const VARIANT_KEY = "wordblocks_variant";
function loadVariant(){
  try { return localStorage.getItem(VARIANT_KEY) || "uk"; }
  catch(e) { return "uk"; }
}
function saveVariant(v){
  try { localStorage.setItem(VARIANT_KEY, v); }
  catch(e) { /* ignore */ }
}

// ---------------------------------------------------------------------
// 10) UI STATE & DESCRIPTIONS
// ---------------------------------------------------------------------
let state = { letters: 3, type: "real", difficulty: "easy", variant: loadVariant() };

const DIFFICULTY_RULES = {
  3: {
    easy: "<b>Easy:</b> short, common words with mostly straightforward letter sounds — many use a simple consonant-vowel-consonant pattern.",
    medium: "<b>Medium:</b> introduces blends, vowel teams and less-obvious vowel patterns in short words. <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters, irregular spelling, or unpredictable pronunciation — the trickiest short words in English. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  },
  4: {
    easy: "<b>Easy:</b> common four-letter words with mostly straightforward sounds and familiar spelling patterns.",
    medium: "<b>Medium:</b> adds consonant blends and digraphs (bl, st, ch, sh), vowel teams, and silent/magic-e patterns. <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters (kn, wr, mb, gh) and irregular spelling patterns that do not sound exactly as they look. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  },
  5: {
    easy: "<b>Easy:</b> common longer words with comparatively straightforward spelling and pronunciation.",
    medium: "<b>Medium:</b> adds blends, digraphs, vowel teams, magic-e, and soft c/g patterns in longer words. <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters and irregular vowel or spelling patterns carried into longer words — the trickiest tier overall. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  }
};

// Letter Pairs mode has no letter-count dimension. The anchor word shown
// beneath every pair defines the intended sound; it does not claim that the
// pair is pronounced the same way in every English word.
const PAIR_DIFFICULTY_RULES = {
  easy: "<b>Easy:</b> a curated consonant + vowel chunk from a simple word. Use the example word to anchor the intended sound.",
  medium: "<b>Medium:</b> a common consonant blend or digraph. Use the example word to hear the pair in context. <i>Also includes Easy pairs for continued practice, reinforcement and fluency.</i>",
  hard: "<b>Hard:</b> a common vowel team or r-controlled spelling pattern, anchored to a specific example word. <i>Also includes Easy and Medium pairs for continued practice, reinforcement and fluency.</i>"
};

const diffDescEl = document.getElementById("diffDesc");
const lettersGroup = document.getElementById("lettersGroup");

function updateDiffDesc(){
  if (state.type === "pairs"){
    const examples = generatePureTierExamples(2, "pairs", state.difficulty, state.variant, 3);
    diffDescEl.innerHTML = PAIR_DIFFICULTY_RULES[state.difficulty] +
      " <i>e.g. " + examples.join(", ") + "</i>";
    return;
  }
  const letters = parseInt(state.letters, 10);
  const examples = generatePureTierExamples(letters, state.type, state.difficulty, state.variant, 3);
  diffDescEl.innerHTML = DIFFICULTY_RULES[letters][state.difficulty] +
    " <i>e.g. " + examples.join(", ") + "</i>";
}

function updateLettersVisibility(){
  // The letter-count picker only makes sense for Real words -- Letter
  // Pairs are always exactly 2 letters, so hide it in that mode.
  lettersGroup.style.display = (state.type === "pairs") ? "none" : "block";
}

function wireSeg(id, key){
  const seg = document.getElementById(id);
  seg.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      seg.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset.val;
      if (key === "type") updateLettersVisibility();
      updateDiffDesc();
    });
  });
}
wireSeg("lettersSeg","letters");
wireSeg("typeSeg","type");
wireSeg("diffSeg","difficulty");
updateLettersVisibility();

// Small flag toggle: tap cycles between UK/AU and US, no label taking up space
const VARIANT_FLAGS = { uk: "🇬🇧🇦🇺", us: "🇺🇸" };
const variantToggleBtn = document.getElementById("variantToggle");

function renderVariantToggle(){
  variantToggleBtn.textContent = VARIANT_FLAGS[state.variant];
  variantToggleBtn.title = state.variant === "uk" ? "UK / Australian spelling (tap to switch)" : "US spelling (tap to switch)";
}
variantToggleBtn.addEventListener("click", ()=>{
  state.variant = state.variant === "uk" ? "us" : "uk";
  saveVariant(state.variant);
  renderVariantToggle();
  updateDiffDesc();
});
renderVariantToggle();

updateDiffDesc();

const stage = document.getElementById("stage");

function renderEntry(entry, type){
  stage.innerHTML = "";

  const tileRow = document.createElement("div");
  tileRow.className = "tileRow";

  [...entry.text].forEach((letter, i)=>{
    const tile = document.createElement("div");
    tile.className = "tile " + (type === "real" ? "real" : "phonetic");
    tile.textContent = letter;
    tile.style.animationDelay = (i*0.06)+"s";
    tileRow.appendChild(tile);
  });
  stage.appendChild(tileRow);

  if (type === "pairs" && entry.example){
    const hint = document.createElement("div");
    hint.className = "pairHint";
    hint.innerHTML = `as in <b>${entry.example}</b>`;
    stage.appendChild(hint);
  }
}

document.getElementById("goBtn").addEventListener("click", ()=>{
  const letters = parseInt(state.letters, 10);
  const excludeSet = new Set(loadHistory());
  const entry = generateEntry(letters, state.type, state.difficulty, state.variant, excludeSet);
  renderEntry(entry, state.type);
  pushHistory(entry.historyKey);
});

// Register the external service worker for fresh PWA installs.
if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(err =>
      console.warn("Word Blocks: service worker registration failed", err)
    );
  });
}
