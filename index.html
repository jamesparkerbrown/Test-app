<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Word Blocks</title>

<!-- iOS home-screen app behaviour: opens full-screen with no Safari chrome
     when added via Share > Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordBlocks">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF6B5B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8E7;
    --ink:#2B2640;
    --coral:#FF6B5B;
    --sky:#3EC6E0;
    --sun:#FFC94A;
    --grass:#5FD69C;
    --card:#FFFFFF;
    --shadow: 6px 6px 0 rgba(43,38,64,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(62,198,224,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,91,0.15), transparent 45%),
      var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100svh;
    padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }
  header{
    text-align:center;
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.5px;
    color:var(--ink);
  }
  h1 span{color:var(--coral);}
  .sub{
    font-weight:700;
    font-size:0.72rem;
    color:#6b6580;
    margin-top:2px;
  }

  .stage{
    background:var(--card);
    border-radius:20px;
    box-shadow: var(--shadow);
    border: 3px solid var(--ink);
    padding:14px 8px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:76px;
    margin-bottom:12px;
    flex-wrap:nowrap;
    gap:6px;
  }
  .tile{
    width:42px; height:42px;
    flex-shrink:0;
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.25rem;
    text-transform:uppercase;
    box-shadow: 2px 2px 0 rgba(43,38,64,0.18);
    opacity:0;
    transform: translateY(14px) scale(0.85);
    animation: pop 0.38s ease forwards;
  }
  .tile.real{ background:var(--grass); }
  .tile.phonetic{ background:var(--sky); }
  @keyframes pop{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .placeholder{
    font-weight:700;
    color:#b8b2c9;
    font-size:0.85rem;
  }

  .controls{
    background:var(--card);
    border-radius:18px;
    border:3px solid var(--ink);
    padding:12px;
    box-shadow: var(--shadow);
    margin-bottom:12px;
  }
  .group{ margin-bottom:9px; }
  .group:last-child{ margin-bottom:0; }
  .label{
    font-weight:800;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#6b6580;
    margin-bottom:4px;
    display:block;
  }
  .seg{
    display:flex;
    gap:6px;
  }
  .seg button{
    flex:1;
    padding:7px 4px;
    border-radius:10px;
    border:2.5px solid var(--ink);
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:0.82rem;
    color:var(--ink);
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .seg button:active{ transform: scale(0.95); }
  .seg button.active{
    background:var(--coral);
    color:#fff;
  }
  .seg button.active.type-real{ background:var(--grass); }
  .seg button.active.type-phon{ background:var(--sky); }

  .diffDesc{
    margin-top:6px;
    font-size:0.7rem;
    font-weight:700;
    color:#6b6580;
    line-height:1.3;
    background:var(--cream);
    border:2px dashed #d8d2e8;
    border-radius:9px;
    padding:6px 8px;
  }
  .diffDesc b{ color:var(--ink); }

  .go{
    width:100%;
    padding:12px;
    border-radius:16px;
    border:3px solid var(--ink);
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:0.4px;
    box-shadow: 4px 4px 0 rgba(43,38,64,0.25);
    cursor:pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    flex-shrink:0;
  }
  .go:active{
    transform: translate(3px,3px);
    box-shadow: 2px 2px 0 rgba(43,38,64,0.25);
  }

  .footerRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:8px;
    flex-shrink:0;
  }
  footer{
    text-align:center;
    font-size:0.68rem;
    color:#a39dbb;
    font-weight:700;
  }

  .installMini{
    height:26px;
    padding:0 9px;
    border-radius:13px;
    border:2px solid var(--ink);
    background:var(--sky);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    font-size:0.68rem;
    font-weight:800;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(43,38,64,0.15);
    flex-shrink:0;
  }
  .installMini:active{ transform:scale(0.94); }

  .flagToggle{
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--card);
    font-size:0.9rem;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
    box-shadow: 2px 2px 0 rgba(43,38,64,0.15);
    flex-shrink:0;
  }
  .flagToggle:active{ transform: scale(0.9); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span>Blocks</span></h1>
    <div class="sub">tap. sound it out. play again.</div>
  </header>

  <div class="stage" id="stage">
    <div class="placeholder">tap the button below to make a word</div>
  </div>

  <div class="controls">
    <div class="group">
      <span class="label">Letters</span>
      <div class="seg" id="lettersSeg">
        <button data-val="3" class="active">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Word type</span>
      <div class="seg" id="typeSeg">
        <button data-val="real" class="active type-real">Real words</button>
        <button data-val="phonetic" class="type-phon">Sound-it-out</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Difficulty</span>
      <div class="seg" id="diffSeg">
        <button data-val="easy" class="active">Easy</button>
        <button data-val="medium">Medium</button>
        <button data-val="hard">Hard</button>
      </div>
      <div class="diffDesc" id="diffDesc"></div>
    </div>
  </div>

  <button class="go" id="goBtn">🎲 New word</button>
  <div class="footerRow">
    <footer id="appFooter">Works offline · add me to your home screen</footer>
    <button id="installBtn" class="installMini" hidden>Install</button>
    <button id="variantToggle" class="flagToggle" title="Switch English spelling"></button>
  </div>
</div>

// ---------------------------------------------------------------------
// 2) DEV-TIME WORD DATABASE VALIDATION
//    Runs once on load. Logs clearly to console; never blocks the app.
// ---------------------------------------------------------------------
(function validateWordDatabase(){
  const errors = [];
  const LENGTHS = [3,4,5];
  const DIFFS = ["easy","medium","hard"];

  function checkWord(w, L, d, source){
    if (typeof w !== "string") { errors.push(`${source}[${L}][${d}]: non-string entry`); return; }
    if (/\s/.test(w)) errors.push(`${source}[${L}][${d}]: "${w}" contains whitespace`);
    if (!/^[a-z]+$/.test(w)) errors.push(`${source}[${L}][${d}]: "${w}" contains punctuation or non-alphabetic characters`);
    if (w.length !== L) errors.push(`${source}[${L}][${d}]: "${w}" is ${w.length} letters, filed under length ${L}`);
  }

  for (const L of LENGTHS){
    if (!BASE_WORDS[L]) { errors.push(`BASE_WORDS missing length ${L}`); continue; }
    for (const d of DIFFS){
      if (!BASE_WORDS[L][d]) { errors.push(`BASE_WORDS[${L}] missing "${d}" array`); continue; }
      const words = BASE_WORDS[L][d];
      if (words.length === 0) errors.push(`BASE_WORDS[${L}][${d}] is empty`);
      const seen = new Set();
      for (const w of words){
        checkWord(w, L, d, "BASE_WORDS");
        if (seen.has(w)) errors.push(`BASE_WORDS[${L}][${d}]: duplicate "${w}"`);
        seen.add(w);
      }
    }
  }

  for (const variant of Object.keys(REGIONAL_WORDS)){
    for (const L of LENGTHS){
      if (!REGIONAL_WORDS[variant][L]) continue;
      for (const d of DIFFS){
        const words = REGIONAL_WORDS[variant][L][d] || [];
        const seen = new Set();
        for (const w of words){
          checkWord(w, L, d, `REGIONAL_WORDS.${variant}`);
          if (seen.has(w)) errors.push(`REGIONAL_WORDS.${variant}[${L}][${d}]: duplicate "${w}"`);
          seen.add(w);
        }
      }
    }
  }

  if (errors.length){
    console.error(`Word Blocks: ${errors.length} word-database issue(s) found:`);
    errors.forEach(e => console.error(" -", e));
  } else {
    console.log("Word Blocks: word database validation passed.");
  }
})();

// ---------------------------------------------------------------------
// 3) WORD POOL HELPER (merges base + regional overlay for a variant)
// ---------------------------------------------------------------------
function getWordPool(length, difficulty, variant){
  const base = (BASE_WORDS[length] && BASE_WORDS[length][difficulty]) || [];
  const regional = (REGIONAL_WORDS[variant] && REGIONAL_WORDS[variant][length] && REGIONAL_WORDS[variant][length][difficulty]) || [];
  return base.concat(regional);
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------------------------------------------------------------------
// 4) CUMULATIVE DIFFICULTY WEIGHTING
//    Medium and Hard include earlier tiers for reinforcement, weighted
//    so genuinely harder words still show up often enough to matter.
// ---------------------------------------------------------------------
const DIFFICULTY_WEIGHTS = {
  easy:   [["easy", 1.0]],
  medium: [["easy", 0.30], ["medium", 0.70]],
  hard:   [["easy", 0.20], ["medium", 0.35], ["hard", 0.45]]
};

function pickWeightedTier(difficulty){
  const weights = DIFFICULTY_WEIGHTS[difficulty];
  const r = Math.random();
  let cumulative = 0;
  for (const [tier, weight] of weights){
    cumulative += weight;
    if (r <= cumulative) return tier;
  }
  return weights[weights.length - 1][0];
}

// ---------------------------------------------------------------------
// 5) RECENT-HISTORY (NO-REPEAT) TRACKING
//    Only the main displayed word counts -- not description examples.
//    Stored locally only; nothing is ever sent anywhere.
// ---------------------------------------------------------------------
const HISTORY_KEY = "wordblocks_recent_history";
const HISTORY_LIMIT = 25;

function loadHistory(){
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveHistory(history){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch(e) { /* localStorage unavailable -- non-critical, fail silently */ }
}
function pushHistory(word){
  let history = loadHistory();
  history.push(word);
  if (history.length > HISTORY_LIMIT) history = history.slice(history.length - HISTORY_LIMIT);
  saveHistory(history);
}

// ---------------------------------------------------------------------
// 6) REAL-WORD GENERATION (cumulative tiers + regional overlay + no-repeat)
// ---------------------------------------------------------------------
function generateRealWord(length, difficulty, variant, excludeSet){
  for (let attempt = 0; attempt < 100; attempt++){
    const tier = pickWeightedTier(difficulty);
    const pool = getWordPool(length, tier, variant);
    if (pool.length === 0) continue;
    const candidate = pick(pool);
    if (!excludeSet.has(candidate)) return candidate;
  }
  // Fallback if the pool is exhausted by exclusion (rare) -- ignore history once.
  const tier = pickWeightedTier(difficulty);
  const pool = getWordPool(length, tier, variant);
  return pool.length ? pick(pool) : "";
}

// ---------------------------------------------------------------------
// 7) PHONETIC (MADE-UP) WORD GENERATOR
//    Same sound-pattern engine as before, now also cumulative and
//    no-repeat aware for Sound-it-out mode.
// ---------------------------------------------------------------------
const VOWELS = ["a","e","i","o","u"];
const SIMPLE_CONSONANTS = "bcdfghjklmnprstvw".split("");
const BLENDS = ["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","sk","sl","sm","sn","sp","st","sw","tr","tw"];
const DIGRAPHS = ["ch","sh","th","wh","ph"];
const TRICKY_CONSONANTS = "bcdfghjklmnpqrstvwxyz".split("");

const DIFFICULTY_CONFIG = {
  easy:   { start: SIMPLE_CONSONANTS, end: SIMPLE_CONSONANTS },
  medium: { start: SIMPLE_CONSONANTS.concat(DIGRAPHS), end: SIMPLE_CONSONANTS },
  hard:   { start: TRICKY_CONSONANTS.concat(BLENDS, DIGRAPHS), end: TRICKY_CONSONANTS.concat(BLENDS) }
};

function buildPhoneticWord(targetLength, tier){
  const cfg = DIFFICULTY_CONFIG[tier];
  for(let attempt=0; attempt<200; attempt++){
    let pieces = [];
    let consonantTurn = true;
    let len = 0;
    while(len < targetLength){
      let chunk;
      if(consonantTurn){
        chunk = pick(pieces.length === 0 ? cfg.start : cfg.end);
      } else {
        chunk = pick(VOWELS);
      }
      pieces.push(chunk);
      len += chunk.length;
      consonantTurn = !consonantTurn;
    }
    const word = pieces.join("");
    if(word.length === targetLength) return word;
  }
  let w = "";
  while(w.length < targetLength) w += pick(VOWELS);
  return w.slice(0, targetLength);
}

function generatePhoneticWord(length, difficulty, excludeSet){
  for (let attempt = 0; attempt < 100; attempt++){
    const tier = pickWeightedTier(difficulty);
    const candidate = buildPhoneticWord(length, tier);
    if (!excludeSet.has(candidate)) return candidate;
  }
  const tier = pickWeightedTier(difficulty);
  return buildPhoneticWord(length, tier);
}

// ---------------------------------------------------------------------
// 8) UNIFIED ENTRY POINTS
// ---------------------------------------------------------------------
function generateWord(length, type, difficulty, variant, excludeSet){
  excludeSet = excludeSet || new Set();
  if (type === "real"){
    return generateRealWord(length, difficulty, variant, excludeSet);
  }
  return generatePhoneticWord(length, difficulty, excludeSet);
}

// Pure-tier examples for the description box: always shows the specific
// patterns of the SELECTED tier (not the cumulative blend used in actual
// play), so "Hard" always demonstrates hard patterns, not random Easy words.
function generatePureTierExamples(length, type, difficulty, variant, n){
  const examples = new Set();
  let attempts = 0;
  while (examples.size < n && attempts < 50){
    let candidate;
    if (type === "real"){
      const pool = getWordPool(length, difficulty, variant);
      if (pool.length === 0) break;
      candidate = pick(pool);
    } else {
      candidate = buildPhoneticWord(length, difficulty);
    }
    examples.add(candidate);
    attempts++;
  }
  return [...examples];
}

// ---------------------------------------------------------------------
// 9) VARIANT (UK/AU vs US) PERSISTENCE
// ---------------------------------------------------------------------
const VARIANT_KEY = "wordblocks_variant";
function loadVariant(){
  try { return localStorage.getItem(VARIANT_KEY) || "uk"; }
  catch(e) { return "uk"; }
}
function saveVariant(v){
  try { localStorage.setItem(VARIANT_KEY, v); }
  catch(e) { /* ignore */ }
}

// 10) UI STATE & DESCRIPTIONS
// ---------------------------------------------------------------------
let state = { letters: 3, type: "real", difficulty: "easy", variant: loadVariant() };

const DIFFICULTY_RULES = {

    medium: "<b>Medium:</b> a blend or long-vowel sound squeezed into just 3 letters — a starting blend (fl, sp, sk) or a vowel pair (ee, oa, oy). <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters, irregular spelling, or unpredictable pronunciation — the trickiest short words in English. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  },

    easy: "<b>Easy:</b> still simple sounds, just one letter longer — usually an extra ending consonant, no blends or letter teams yet.",
    medium: "<b>Medium:</b> a consonant blend or digraph (bl, st, ch, sh) at the start or end, a vowel pair (ee, oo, ai), or silent/magic-e (cake, hope). <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters (kn, wr, mb, gh) and irregular spelling patterns that don't sound like they're written. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  },
  5: {
    easy: "<b>Easy:</b> longer, often two syllables, but each part still uses simple single consonants and vowels — no blends.",
    medium: "<b>Medium:</b> the same blends, digraphs and vowel teams as shorter words, plus magic-e and soft c/g sounds (dance, magic). <i>Also includes Easy words for continued practice, reinforcement and fluency.</i>",
    hard: "<b>Hard:</b> silent letters and irregular vowel patterns carried into longer words — trickiest tier overall. <i>Also includes Easy and Medium words for continued practice, reinforcement and fluency.</i>"
  }
};

const diffDescEl = document.getElementById("diffDesc");

function updateDiffDesc(){
  const letters = parseInt(state.letters, 10);
  const examples = generatePureTierExamples(letters, state.type, state.difficulty, state.variant, 3);
  diffDescEl.innerHTML = DIFFICULTY_RULES[letters][state.difficulty] +
    " <i>e.g. " + examples.join(", ") + "</i>";
}

function wireSeg(id, key){
  const seg = document.getElementById(id);
  seg.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      seg.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset.val;
      updateDiffDesc();
    });
  });
}
wireSeg("lettersSeg","letters");
wireSeg("typeSeg","type");
wireSeg("diffSeg","difficulty");

// Small flag toggle: tap cycles between UK/AU and US, no label taking up space
const VARIANT_FLAGS = { uk: "🇬🇧🇦🇺", us: "🇺🇸" };
const variantToggleBtn = document.getElementById("variantToggle");

function renderVariantToggle(){
  variantToggleBtn.textContent = VARIANT_FLAGS[state.variant];
  variantToggleBtn.title = state.variant === "uk" ? "UK / Australian spelling (tap to switch)" : "US spelling (tap to switch)";
}
variantToggleBtn.addEventListener("click", ()=>{
  state.variant = state.variant === "uk" ? "us" : "uk";
  saveVariant(state.variant);
  renderVariantToggle();
  updateDiffDesc();
});
renderVariantToggle();

updateDiffDesc();

const stage = document.getElementById("stage");

function renderWord(word, type){
  stage.innerHTML = "";
  [...word].forEach((letter, i)=>{
    const tile = document.createElement("div");
    tile.className = "tile " + (type === "real" ? "real" : "phonetic");
    tile.textContent = letter;
    tile.style.animationDelay = (i*0.06)+"s";
    stage.appendChild(tile);
  });
}

document.getElementById("goBtn").addEventListener("click", ()=>{
  const letters = parseInt(state.letters, 10);
  const excludeSet = new Set(loadHistory());
  const word = generateWord(letters, state.type, state.difficulty, state.variant, excludeSet);
  renderWord(word, state.type);
  pushHistory(word);
});

<script>
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installBtn");
  const appFooter = document.getElementById("appFooter");

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }

  if (isStandalone() && appFooter) {
    appFooter.textContent = "Works offline";
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    if (installBtn) installBtn.hidden = false;
    if (appFooter) appFooter.textContent = "Works offline";
  });

  if (installBtn) {
    installBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    });
  }

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    if (installBtn) installBtn.hidden = true;
    if (appFooter) appFooter.textContent = "Works offline";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.error("Service worker registration failed:", err);
      });
    });
  }
</script>
