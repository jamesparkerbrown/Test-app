<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFF8E7">
<meta name="application-name" content="Word Blocks">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Word Blocks">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Word Blocks</title>
<style>
  :root{
    --cream:#FFF8E7;
    --ink:#2B2640;
    --coral:#FF6B5B;
    --sky:#3EC6E0;
    --sun:#FFC94A;
    --grass:#5FD69C;
    --card:#FFFFFF;
    --shadow: 6px 6px 0 rgba(43,38,64,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(62,198,224,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,107,91,0.15), transparent 45%),
      var(--cream);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:22px 18px 40px;
    display:flex;
    flex-direction:column;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  h1{
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    font-weight:800;
    font-size:2.1rem;
    margin:0;
    letter-spacing:0.5px;
    color:var(--ink);
  }
  h1 span{color:var(--coral);}
  .sub{
    font-weight:700;
    font-size:0.85rem;
    color:#6b6580;
    margin-top:4px;
  }

  .stage{
    background:var(--card);
    border-radius:24px;
    box-shadow: var(--shadow);
    border: 3px solid var(--ink);
    padding:28px 16px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:120px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }
  .tile{
    width:52px; height:52px;
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    font-weight:800;
    font-size:1.6rem;
    text-transform:uppercase;
    box-shadow: 3px 3px 0 rgba(43,38,64,0.18);
    opacity:0;
    transform: translateY(14px) scale(0.85);
    animation: pop 0.38s ease forwards;
  }
  .tile.real{ background:var(--grass); }
  .tile.phonetic{ background:var(--sky); }
  @keyframes pop{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .placeholder{
    font-weight:700;
    color:#b8b2c9;
    font-size:1rem;
  }

  .controls{
    background:var(--card);
    border-radius:20px;
    border:3px solid var(--ink);
    padding:16px;
    box-shadow: var(--shadow);
    margin-bottom:16px;
  }
  .group{ margin-bottom:14px; }
  .group:last-child{ margin-bottom:0; }
  .label{
    font-weight:800;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#6b6580;
    margin-bottom:8px;
    display:block;
  }
  .seg{
    display:flex;
    gap:8px;
  }
  .seg button{
    flex:1;
    padding:10px 6px;
    border-radius:12px;
    border:2.5px solid var(--ink);
    background:var(--cream);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:800;
    font-size:0.92rem;
    color:var(--ink);
    cursor:pointer;
    transition: transform 0.12s ease;
  }
  .seg button:active{ transform: scale(0.95); }
  .seg button.active{
    background:var(--coral);
    color:#fff;
  }
  .seg button.active.type-real{ background:var(--grass); }
  .seg button.active.type-phon{ background:var(--sky); }

  .diffDesc{
    margin-top:8px;
    font-size:0.78rem;
    font-weight:700;
    color:#6b6580;
    line-height:1.35;
    background:var(--cream);
    border:2px dashed #d8d2e8;
    border-radius:10px;
    padding:8px 10px;
  }
  .diffDesc b{ color:var(--ink); }

  .go{
    width:100%;
    padding:18px;
    border-radius:18px;
    border:3px solid var(--ink);
    background:var(--coral);
    color:#fff;
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
    font-weight:800;
    font-size:1.3rem;
    letter-spacing:0.4px;
    box-shadow: 5px 5px 0 rgba(43,38,64,0.25);
    cursor:pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .go:active{
    transform: translate(3px,3px);
    box-shadow: 2px 2px 0 rgba(43,38,64,0.25);
  }


  .install{
    width:100%;
    margin-top:12px;
    padding:13px 16px;
    border-radius:16px;
    border:3px solid var(--ink);
    background:var(--sky);
    color:var(--ink);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:800;
    font-size:1rem;
    box-shadow: 4px 4px 0 rgba(43,38,64,0.18);
    cursor:pointer;
  }
  .install:active{
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 rgba(43,38,64,0.18);
  }

  footer{
    text-align:center;
    margin-top:20px;
    font-size:0.75rem;
    color:#a39dbb;
    font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word<span>Blocks</span></h1>
    <div class="sub">tap. sound it out. play again.</div>
  </header>

  <div class="stage" id="stage">
    <div class="placeholder">tap the button below to make a word</div>
  </div>

  <div class="controls">
    <div class="group">
      <span class="label">Letters</span>
      <div class="seg" id="lettersSeg">
        <button data-val="3" class="active">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Word type</span>
      <div class="seg" id="typeSeg">
        <button data-val="real" class="active type-real">Real words</button>
        <button data-val="phonetic" class="type-phon">Sound-it-out</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Difficulty</span>
      <div class="seg" id="diffSeg">
        <button data-val="easy" class="active">Easy</button>
        <button data-val="medium">Medium</button>
        <button data-val="hard">Hard</button>
      </div>
      <div class="diffDesc" id="diffDesc"></div>
    </div>
  </div>

  <button class="go" id="goBtn">🎲 New word</button>
  <button class="install" id="installBtn" hidden>⬇ Install Word Blocks</button>
  <footer id="appFooter">Works offline</footer>
</div>

// Dev-time safety net: verify every word's length matches its bucket key.
// (Catches the exact class of bug this file previously had — words like
// "dwell" or "debt" ending up filed under the wrong letter-count.)
(function validateWordLengths(){
  for (const L of [3,4,5]) {
    for (const d of ["easy","medium","hard"]) {
      for (const w of REAL_WORDS[L][d]) {
        if (w.length !== L) {
          console.error(`Word "${w}" is ${w.length} letters but filed under length ${L} (${d})`);
        }
      }
    }
  }
})();

const VOWELS = ["a","e","i","o","u"];
const SIMPLE_CONSONANTS = "bcdfghjklmnprstvw".split("");
const BLENDS = ["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","sk","sl","sm","sn","sp","st","sw","tr","tw"];
const DIGRAPHS = ["ch","sh","th","wh","ph"];
const TRICKY_CONSONANTS = "bcdfghjklmnpqrstvwxyz".split("");

const DIFFICULTY_CONFIG = {
  easy:   { start: SIMPLE_CONSONANTS, end: SIMPLE_CONSONANTS },
  medium: { start: SIMPLE_CONSONANTS.concat(DIGRAPHS), end: SIMPLE_CONSONANTS },
  hard:   { start: TRICKY_CONSONANTS.concat(BLENDS, DIGRAPHS), end: TRICKY_CONSONANTS.concat(BLENDS) }
};

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildPhoneticWord(targetLength, difficulty){
  const cfg = DIFFICULTY_CONFIG[difficulty];
  for(let attempt=0; attempt<200; attempt++){
    let pieces = [];
    let consonantTurn = true;
    let len = 0;
    while(len < targetLength){
      let chunk;
      if(consonantTurn){
        chunk = pick(pieces.length === 0 ? cfg.start : cfg.end);
      } else {
        chunk = pick(VOWELS);
      }
      pieces.push(chunk);
      len += chunk.length;
      consonantTurn = !consonantTurn;
    }
    const word = pieces.join("");
    if(word.length === targetLength) return word;
  }
  // fallback trim/pad
  let word = pieces_fallback();
  return word;
  function pieces_fallback(){
    let w = "";
    while(w.length < targetLength) w += pick(VOWELS);
    return w.slice(0, targetLength);
  }
}

function generateWord(letters, type, difficulty){
  if(type === "real"){
    const pool = REAL_WORDS[letters][difficulty];
    return pick(pool);
  }
  return buildPhoneticWord(letters, difficulty);
}

// UI wiring
// ---------------------------------------------------------------------
let state = { letters: 3, type: "real", difficulty: "easy" };

const DIFFICULTY_RULES = {
  3: {
    easy: "<b>Easy:</b> the most basic pattern — one consonant, one vowel, one consonant (CVC), nothing else.",
    medium: "<b>Medium:</b> a blend or long-vowel sound squeezed into just 3 letters — a starting blend (fl, sp, sk) or a vowel pair (ee, oa, oy).",
    hard: "<b>Hard:</b> true 3-letter tricky words are rare in English — just a couple of silent-letter oddities (gn, wr)."
  },
  4: {
    easy: "<b>Easy:</b> still simple sounds, just one letter longer — usually an extra ending consonant, no blends or letter teams yet.",
    medium: "<b>Medium:</b> a consonant blend or digraph (bl, st, ch, sh) at the start or end, or a vowel pair (ee, oo, ai) in the middle.",
    hard: "<b>Hard:</b> silent letters (kn, wr, mb, gh) and irregular spelling patterns (igh, eigh) that don't sound like they're written."
  },
  5: {
    easy: "<b>Easy:</b> longer, often two syllables, but each part still uses simple single consonants and vowels — no blends.",
    medium: "<b>Medium:</b> the same blends and digraphs as shorter words (bl, sh, ch), plus vowel teams (ee, ui, ai), just stretched across 5 letters.",
    hard: "<b>Hard:</b> silent letters and irregular vowel patterns carried into longer words — trickiest tier overall."
  }
};

const diffDescEl = document.getElementById("diffDesc");

function getExamples(letters, type, difficulty, n){
  const examples = new Set();
  let attempts = 0;
  while(examples.size < n && attempts < 50){
    examples.add(generateWord(letters, type, difficulty));
    attempts++;
  }
  return [...examples];
}

function updateDiffDesc(){
  const letters = parseInt(state.letters, 10);
  const examples = getExamples(letters, state.type, state.difficulty, 3);
  diffDescEl.innerHTML = DIFFICULTY_RULES[letters][state.difficulty] +
    " <i>e.g. " + examples.join(", ") + "</i>";
}

function wireSeg(id, key, extraClassMap){
  const seg = document.getElementById(id);
  seg.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      seg.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset.val;
      updateDiffDesc();
    });
  });
}
wireSeg("lettersSeg","letters");
wireSeg("typeSeg","type");
wireSeg("diffSeg","difficulty");
updateDiffDesc();

const stage = document.getElementById("stage");

function renderWord(word, type){
  stage.innerHTML = "";
  [...word].forEach((letter, i)=>{
    const tile = document.createElement("div");
    tile.className = "tile " + (type === "real" ? "real" : "phonetic");
    tile.textContent = letter;
    tile.style.animationDelay = (i*0.06)+"s";
    stage.appendChild(tile);
  });
}

document.getElementById("goBtn").addEventListener("click", ()=>{
  const letters = parseInt(state.letters, 10);
  const word = generateWord(letters, state.type, state.difficulty);
  renderWord(word, state.type);
});
</script>
<script>
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installBtn");
  const appFooter = document.getElementById("appFooter");

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }

  if (isStandalone()) {
    appFooter.textContent = "Works offline";
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installBtn.hidden = false;
    appFooter.textContent = "Works offline · installable";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    installBtn.hidden = true;
    appFooter.textContent = "Works offline";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.error("Service worker registration failed:", err);
      });
    });
  }
</script>
